<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Three routes for evaluating text-to-speech</title>
<desc id="desc">Generate matching clips from the same text and target voice, then assess them with human listening, model-based checks, and service measurements. Report each result separately.</desc>
<rect x="0" y="0" width="1500" height="760" rx="0" fill="#f7f9fd" stroke="none" stroke-width="1"/>
<text x="50" y="60" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#18304d">TTS quality needs more than one score</text>
<text x="50" y="92" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#52647b">Use the same prompts and voice setup for every system.</text>
