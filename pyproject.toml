[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-evaluation-methods"
version = "0.1.0"
description = "Transparent ASR scoring and speech evaluation guidance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "darren236"}]

[project.scripts]
speech-eval = "speech_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
